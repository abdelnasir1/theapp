name: untitled1
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  provider: ^6.1.1
  video_player: ^2.8.2
  image_picker: ^1.0.7
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.6
  flutter_localization: ^0.4.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/tajawal/Tajawal-Regular.ttf
          weight: 400

