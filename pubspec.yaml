name:  com.maazplatform.solutions
description: "maazplatform solutions"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  video_player: ^2.14.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.4
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/sounds/
    - assets/headers/
    - assets/footers/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/tajawal/Tajawal-Regular.ttf
          weight: 400


flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/resized_thelogo.png
  android: true
  ios: false
  web: false

  # Specific settings for Android 12+
  android_12:
    color: "#FFFFFF"
    image: assets/images/resized_thelogo.png